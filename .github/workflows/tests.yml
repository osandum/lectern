name: Tests

# Two distros rather than a Python matrix, deliberately. PyGObject here is
# a *system* package (it carries the GTK4/libadwaita typelibs), so it is
# pinned to whatever Python the distro ships -- `actions/setup-python` plus
# `pip install PyGObject` builds from source and still has no typelibs.
# Nothing would be learned from a second Python version anyway; what this
# project is actually sensitive to is the GTK version, having already hit
# two version-specific behaviours (Gtk.Label merging attributes into its
# cached PangoLayout, and Gtk.TextView ignoring hexpand on anchored
# children). Ubuntu ships an older GTK than Fedora, so the pair brackets
# the range that matters.
#
# Both jobs need xvfb: widget construction segfaults with no display at
# all, even though no window is ever shown.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu (older GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4, libadwaita and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-soup-3.0 \
            librsvg2-common xvfb

      # Mirrors the setup the README documents, so that breaking the
      # documented install breaks CI too.
      - name: Set up the venv the README describes
        run: |
          python3 -m venv .venv --system-site-packages
          .venv/bin/pip install -e .
          .venv/bin/pip install pytest

      - name: Report the versions actually under test
        run: |
          .venv/bin/python -c "import sys, gi; \
            gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); \
            from gi.repository import Gtk, Adw; \
            print('python', sys.version.split()[0]); \
            print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version()); \
            print('Adw', Adw.get_major_version(), Adw.get_minor_version())"

      # xvfb is required: constructing a Gtk.Grid segfaults outright with
      # no display. Note that unsetting DISPLAY/WAYLAND_DISPLAY on a
      # desktop does NOT reproduce this -- GDK falls back to the default
      # "wayland-0" socket in XDG_RUNTIME_DIR and connects anyway, which
      # is what made this look headless locally.
      #
      # GSK_RENDERER=cairo because test_layout.py presents a real window
      # (the only way a CSS font-size reaches a TextView's layout), and
      # the default GL renderer *aborts the process* when libGLESv2 is
      # absent, as it is here -- SIGABRT, not an exception. The
      # alternative is installing mesa-libGLES + mesa-dri-drivers, which
      # is a lot of GL to carry for tests that never draw. tests/conftest.py
      # sets the same default, so this is belt and braces -- but it is set
      # here too so the reason is visible at the point of failure.
      - name: Run tests
        env:
          GSK_RENDERER: cairo
        run: xvfb-run -a .venv/bin/python -m pytest -q

  fedora:
    name: Fedora (newer GTK)
    runs-on: ubuntu-latest
    # Pinned rather than :latest so a distro bump is a deliberate commit
    # instead of a surprise red build. Matches the development machine.
    container:
      image: fedora:44
      # On Fedora 44 (not 42) gdk-pixbuf decodes images through glycin, which runs
      # every decoder in a bubblewrap sandbox; bwrap can't create its
      # namespaces in an unprivileged container, so without this every
      # image (and clipboard) test fails with "Loader process exited early".
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # gobject-introspection is named explicitly: on Fedora 44 it carries
      # the cairo typelib Gtk needs, and python3-gobject no longer pulls it
      # in once weak dependencies are off.
      - name: Install GTK4, libadwaita and PyGObject
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git python3-pip python3-gobject gobject-introspection \
            gtk4 libadwaita libsoup3 librsvg2 \
            xorg-x11-server-Xvfb dejavu-sans-fonts

      - name: Set up the venv the README describes
        run: |
          python3 -m venv .venv --system-site-packages
          .venv/bin/pip install -e .
          .venv/bin/pip install pytest

      - name: Report the versions actually under test
        run: |
          .venv/bin/python -c "import sys, gi; \
            gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); \
            from gi.repository import Gtk, Adw; \
            print('python', sys.version.split()[0]); \
            print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version()); \
            print('Adw', Adw.get_major_version(), Adw.get_minor_version())"

      # xvfb and GSK_RENDERER here too; see the Ubuntu job for why.
      - name: Run tests
        env:
          GSK_RENDERER: cairo
        run: xvfb-run -a .venv/bin/python -m pytest -q
