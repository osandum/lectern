[project]
name = "lectern"
version = "0.4.0"
description = "A read-only, Papers-style GTK4/Libadwaita Markdown viewer"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.46",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
lectern = "lectern.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lectern*"]

[tool.setuptools.package-data]
# Compiled translation catalogues (see po/README.md for how they get
# built) -- lectern/i18n.py loads them from here at runtime. An empty
# match (no languages built yet) is not an error.
lectern = ["locale/*/LC_MESSAGES/*.mo"]
